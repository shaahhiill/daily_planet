name: daily_planet
description: "A Daily Planet news application."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  battery_plus: ^6.0.5
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/daily_planet_logo.png
    - assets/json/offline_news.json
    - .env
